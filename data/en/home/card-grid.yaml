header:
  title: Browse the library.
  description: The guides are generated and maintained by Doc Holiday, the AI-native software platform for crystal-clear documentation and release notes.

items:
  - icon: menu_book
    title: DSPy Field Guide
    description: The DSPy codebase, explained at the concept level — Signature, Module, Adapter, and the LM layer, plus caching, compilation, the proposer, and streaming.
    link:
      label: Read the guide
      url: "dspy/the-big-picture/"

  - icon: menu_book
    title: Strix Field Guide
    description: The Strix codebase, explained at the concept level — an autonomous pentest app built on the OpenAI Agents SDK, from the agent graph to the Docker sandbox and the finding-to-report pipeline.
    link:
      label: Read the guide
      url: "strix/the-big-picture/"

  - icon: menu_book
    title: browser-use Field Guide
    description: The browser-use codebase, explained at the concept level — an AI browser-automation agent, from the event bus and watchdogs to the CDP execution layer, the action registry, and how the agent sees the page.
    link:
      label: Read the guide
      url: "browser-use/the-big-picture/"

  - icon: menu_book
    title: RAGFlow Field Guide
    description: The RAGFlow codebase, explained at the concept level — a deep-document RAG engine, from the ingestion pipeline and chunking templates to the embedding layer, GraphRAG, and the canvas orchestrator.
    link:
      label: Read the guide
      url: "ragflow/the-big-picture/"

  - icon: menu_book
    title: Dify Field Guide
    description: The Dify codebase, explained at the concept level — an LLM app platform and its Graphon workflow engine, from the graph execution model and variable system to pause/resume, the model runtime, and the plugin system.
    link:
      label: Read the guide
      url: "dify/the-big-picture/"

  - icon: menu_book
    title: CrewAI Field Guide
    description: The CrewAI codebase, explained at the concept level — a multi-agent orchestration framework, from the kickoff and agent-executor loop to the hierarchical process, the flow scheduler, and where state lives.
    link:
      label: Read the guide
      url: "crewai/the-big-picture/"

  - icon: menu_book
    title: n8n Field Guide
    description: The n8n codebase, explained at the concept level — a workflow-automation engine, from how the engine decides what runs next and why the canvas is not the execution to partial executions, items and pairedItem, and triggers.
    link:
      label: Read the guide
      url: "n8n/the-big-picture/"

  - icon: menu_book
    title: Letta Field Guide
    description: The Letta v2 codebase, explained at the concept level — a stateful agent harness, from the turn lifecycle and per-conversation queues to memory blocks, the git-tracked memory filesystem, dreaming, and client-side tools.
    link:
      label: Read the guide
      url: "letta/the-big-picture/"

  - icon: menu_book
    title: LangGraph Field Guide
    description: The LangGraph codebase, explained at the concept level — a durable agent runtime, from the superstep engine and the version-trigger mechanism to how state compiles to channels, control flow, and what checkpoints really store.
    link:
      label: Read the guide
      url: "langgraph/the-big-picture/"

  # The Doc Holiday product card sits deliberately last, blended into the guide
  # grid (same card treatment, not a distinct ad).
  - icon: build/doc-holiday
    title: Doc Holiday
    description: Doc Holiday is the AI-native software platform that automatically transforms code commits and product specs into crystal-clear documentation and release notes that stay up-to-date while you stay out late.
    link:
      label: Learn more
      url: "https://doc.holiday/"
