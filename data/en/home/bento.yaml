header:
  title: Mental models, not API dumps.
  description: Each guide transfers the mental model of one codebase — what each subsystem is for, the design decisions behind it, and how the pieces relate. The kind of orientation a new contributor usually has to reverse-engineer.

items:
  - col: col-5
    icon: bento/rocket_launch
    title: Get up to speed without reading the whole repo
    description: Every guide opens with a big-picture map and an end-to-end "anatomy of a call" trace, so you can hold the whole architecture in your head before opening a file.
    badges: [ ]

  - col: col-7
    icon: bento/extension
    title: Grounded in the source
    description: Every claim cites real files and symbols from the project, and every page ends with a "Where to look in the code" map. Nothing here is folklore — it was read out of the code.
    badges: [ ]

  - col: col-7
    icon: bento/shield
    title: Complements the official docs
    description: Each project's own docs own tutorials and API reference. These guides cover the connective architecture — the subsystems and relationships the reference pages leave implicit.
    badges: [ ]

  - col: col-5
    icon: comic_bubble
    title: Have an OSS project you want to see here?
    description: Tell us which codebase deserves a field guide and we'll take a look.
    link:
      label: Email us
      url: "mailto:engineering@sandgarden.com"
