# Per-project chrome, keyed by content section (.Section). The header and
# left-sidebar overrides look up the current project here; the library home
# (empty .Section) falls back to the site defaults (logo.svg / site.Title).
#
# logo paths are slash-less on purpose: they are piped through `relURL`, which
# leaves a leading-slash path host-relative and so would drop the /library/
# Pages subpath (the G1 leading-slash gotcha). Slash-less → resolved under baseURL.
dspy:
  name: DSPy Field Guide
  logo: dspy-logo.svg
  repo: https://github.com/stanfordnlp/dspy
strix:
  name: Strix Field Guide
  logo: strix-logo.svg
  repo: https://github.com/usestrix/strix
browser-use:
  name: browser-use Field Guide
  logo: browser-use-logo.svg
  repo: https://github.com/browser-use/browser-use
ragflow:
  name: RAGFlow Field Guide
  logo: ragflow-logo.svg
  repo: https://github.com/infiniflow/ragflow
dify:
  name: Dify Field Guide
  logo: dify-logo.svg
  repo: https://github.com/langgenius/dify
crewai:
  name: CrewAI Field Guide
  logo: crewai-logo.svg
  repo: https://github.com/crewAIInc/crewAI
n8n:
  name: n8n Field Guide
  logo: n8n-logo.svg
  repo: https://github.com/n8n-io/n8n
letta:
  name: Letta Field Guide
  logo: letta-logo.svg
  repo: https://github.com/letta-ai/letta-code
langgraph:
  name: LangGraph Field Guide
  logo: langgraph-logo.svg
  repo: https://github.com/langchain-ai/langgraph
